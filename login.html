<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pawster - Login</title>
  <link rel="stylesheet" href="css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="mesh-container">
    <div class="mesh-base"></div>
    <div class="orb-wrap orb-wrap-1"><div class="orb" id="o1"></div></div>
    <div class="orb-wrap orb-wrap-2"><div class="orb" id="o2"></div></div>
    <div class="orb-wrap orb-wrap-3"><div class="orb" id="o3"></div></div>
    <div class="orb-wrap orb-wrap-4"><div class="orb" id="o4"></div></div>
    <div class="orb-wrap orb-wrap-5"><div class="orb" id="o5"></div></div>
    <div class="orb-wrap orb-wrap-6"><div class="orb" id="o6"></div></div>
    <div class="mesh-grid"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <nav class="navbar">
    <button class="nav-signin">Sign in</button>
    <button class="nav-register" onclick="window.location.href='register.html'">Register</button>
    <a href="index.html" class="nav-logo-wrap">
      <img src="images/logo.png" alt="Pawster Logo" />
    </a>
  </nav>

  <div class="page">
    <div class="left-panel">

      <div class="paw-layer">
        <svg class="paw paw-1" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="50" cy="66" rx="24" ry="21"/>
          <ellipse cx="25" cy="43" rx="11" ry="14" transform="rotate(-14 25 43)"/>
          <ellipse cx="43" cy="33" rx="11" ry="14" transform="rotate(-5 43 33)"/>
          <ellipse cx="62" cy="33" rx="11" ry="14" transform="rotate(5 62 33)"/>
          <ellipse cx="78" cy="43" rx="10" ry="13" transform="rotate(14 78 43)"/>
        </svg>
        <svg class="paw paw-2" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="50" cy="66" rx="24" ry="21"/>
          <ellipse cx="25" cy="43" rx="11" ry="14" transform="rotate(-14 25 43)"/>
          <ellipse cx="43" cy="33" rx="11" ry="14" transform="rotate(-5 43 33)"/>
          <ellipse cx="62" cy="33" rx="11" ry="14" transform="rotate(5 62 33)"/>
          <ellipse cx="78" cy="43" rx="10" ry="13" transform="rotate(14 78 43)"/>
        </svg>

        <svg class="paw paw-3" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="50" cy="66" rx="24" ry="21"/>
          <ellipse cx="25" cy="43" rx="11" ry="14" transform="rotate(-14 25 43)"/>
          <ellipse cx="43" cy="33" rx="11" ry="14" transform="rotate(-5 43 33)"/>
          <ellipse cx="62" cy="33" rx="11" ry="14" transform="rotate(5 62 33)"/>
          <ellipse cx="78" cy="43" rx="10" ry="13" transform="rotate(14 78 43)"/>
        </svg>

        <svg class="paw paw-4" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="50" cy="66" rx="24" ry="21"/>
          <ellipse cx="25" cy="43" rx="11" ry="14" transform="rotate(-14 25 43)"/>
          <ellipse cx="43" cy="33" rx="11" ry="14" transform="rotate(-5 43 33)"/>
          <ellipse cx="62" cy="33" rx="11" ry="14" transform="rotate(5 62 33)"/>
          <ellipse cx="78" cy="43" rx="10" ry="13" transform="rotate(14 78 43)"/>
        </svg>

        <svg class="paw paw-5" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="50" cy="66" rx="24" ry="21"/>
          <ellipse cx="25" cy="43" rx="11" ry="14" transform="rotate(-14 25 43)"/>
          <ellipse cx="43" cy="33" rx="11" ry="14" transform="rotate(-5 43 33)"/>
          <ellipse cx="62" cy="33" rx="11" ry="14" transform="rotate(5 62 33)"/>
          <ellipse cx="78" cy="43" rx="10" ry="13" transform="rotate(14 78 43)"/>
        </svg>

        <svg class="paw paw-6" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="50" cy="66" rx="24" ry="21"/>
          <ellipse cx="25" cy="43" rx="11" ry="14" transform="rotate(-14 25 43)"/>
          <ellipse cx="43" cy="33" rx="11" ry="14" transform="rotate(-5 43 33)"/>
          <ellipse cx="62" cy="33" rx="11" ry="14" transform="rotate(5 62 33)"/>
          <ellipse cx="78" cy="43" rx="10" ry="13" transform="rotate(14 78 43)"/>
        </svg>

      </div>
           <video class="dog-img" autoplay loop muted playsinline>
        <source src="images/dog.webm" type="video/webm" />
      </video>

      <div class="hero-text">
        <h1 class="hero-title">Every Pet<br/>Deserves Love</h1>
        <p class="hero-subtitle">
          Join our community of compassionate adopters and rescue
          organizations making a real difference in animals' lives.
        </p>
      </div>

    </div>
    <div class="right-panel">

      <h2 class="form-title">Welcome Back!</h2>
      <p class="form-subtitle">
        Sign in to continue your journey of making a difference in an animal's life
      </p>

      <div class="alert alert-error"   id="alertError"   style="display:none;"></div>
      <div class="alert alert-success" id="alertSuccess" style="display:none;"></div>

      <form id="loginForm" novalidate>

        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input class="field-input" type="email" id="email" placeholder="Enter email..." />
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input class="field-input" type="password" id="password" placeholder="Enter password..." />
          <span class="field-error" id="passwordError"></span>
        </div>

        <div class="form-row">
          <label class="remember-label">
            <input type="checkbox" id="remember" class="remember-check" />
            Remember me
          </label>
          <button type="button" class="forgot-btn" id="forgotBtn">Forgot password?</button>
        </div>

        <button type="submit" class="signin-btn" id="submitBtn">Sign in</button>

      </form>

      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">Or continue with</span>
        <span class="divider-line"></span>
      </div>

      <div class="social-row">
        <button class="social-btn" title="Google">
          <svg width="22" height="22" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
        </button>
        <button class="social-btn" title="Apple">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#000">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
        </button>
        <button class="social-btn" title="Facebook">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </button>
      </div>

      <p class="footer-text">
        Don't have an account?
        <a href="../register.html" class="footer-link">Create Account!</a>
      </p>

    </div>

  </div>

  <script src="js/login.js" defer></script>
</body>
</html>
