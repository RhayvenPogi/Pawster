  # ── Missing Pets ──────────────────────────────────────────────────────────────
  # GET  /api/missing-pets/**  → permitAll
  # POST /api/missing-pets     → permitAll
  # admin sub-routes           → admin (under /api/admin/** catch-all? No —
  #   these are /api/missing-pets/admin/... → covered by anyRequest().authenticated
  #   but admin-specific paths use hasAnyAuthority in controller logic / admin tag)

  /api/missing-pets:
    get:
      tags: [Missing Pets]
      summary: 🔓 Get all approved missing pet reports
      security: []
      responses:
        '200':
          description: Approved missing pet reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MissingPet'

    post:
      tags: [Missing Pets]
      summary: 🔓 Submit a new missing/found pet report (multipart)
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, species, area, address]
              properties:
                type:
                  type: string
                  example: missing
                name:
                  type: string
                  example: Buddy
                species:
                  type: string
                  example: Dog
                breed:
                  type: string
                  example: Labrador
                area:
                  type: string
                  example: Tondo, Manila
                address:
                  type: string
                  example: 123 Rizal Street
                color:
                  type: string
                  example: Brown
                details:
                  type: string
                  example: Last seen near the park wearing a red collar.
                latitude:
                  type: number
                  format: double
                  example: 14.5995
                longitude:
                  type: number
                  format: double
                  example: 120.9842
                reporterUserId:
                  type: integer
                  example: 3
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingPet'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/missing-pets/admin/all:
    get:
      tags: [Missing Pets]
      summary: 🔐 Get all reports regardless of status (authenticated — admin recommended)
      responses:
        '200':
          description: All reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MissingPet'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/missing-pets/admin/{id}:
    put:
      tags: [Missing Pets]
      summary: 🔐 Admin update a report via JSON body
      parameters:
        - $ref: '#/components/parameters/LongIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissingPet'
      responses:
        '200':
          description: Updated report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingPet'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [Missing Pets]
      summary: 🔐 Admin delete a report
      parameters:
        - $ref: '#/components/parameters/LongIdPath'
      responses:
        '204':
          description: Report deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/missing-pets/admin/{id}/approve:
    put:
      tags: [Missing Pets]
      summary: 🔐 Approve a missing pet report
      parameters:
        - $ref: '#/components/parameters/LongIdPath'
      responses:
        '200':
          description: Report approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingPet'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/missing-pets/admin/{id}/reject:
    put:
      tags: [Missing Pets]
      summary: 🔐 Reject a missing pet report
      parameters:
        - $ref: '#/components/parameters/LongIdPath'
      responses:
        '200':
          description: Report rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingPet'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/missing-pets/{id}:
    put:
      tags: [Missing Pets]
      summary: 🔐 User updates their own report (multipart, optional new photo)
      parameters:
        - $ref: '#/components/parameters/LongIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, species, area, address]
              properties:
                type:
                  type: string
                name:
                  type: string
                species:
                  type: string
                breed:
                  type: string
                area:
                  type: string
                address:
                  type: string
                color:
                  type: string
                details:
                  type: string
                latitude:
                  type: number
                  format: double
                longitude:
                  type: number
                  format: double
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingPet'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/missing-pets/{id}/resolve:
    put:
      tags: [Missing Pets]
      summary: 🔐 User marks their report as resolved
      parameters:
        - $ref: '#/components/parameters/LongIdPath'
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Report resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingPet'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Pet Comments ──────────────────────────────────────────────────────────────
  # GET /api/missing-pets/**  → permitAll (covers comments too)
  # POST / DELETE             → anyRequest().authenticated()

  /api/missing-pets/{petId}/comments:
    get:
      tags: [Pet Comments]
      summary: 🔓 Get all comments for a missing pet report
      security: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 10
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetComment'

    post:
      tags: [Pet Comments]
      summary: 🔐 Add a comment to a missing pet report
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetCommentRequest'
      responses:
        '200':
          description: Comment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetComment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/missing-pets/{petId}/comments/{commentId}:
    delete:
      tags: [Pet Comments]
      summary: 🔐 Delete a comment (admin recommended)
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Comment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Activity Logs ─────────────────────────────────────────────────────────────
  # /api/admin/** → hasAnyAuthority("admin","ADMIN")

  /api/admin/activity-logs:
    get:
      tags: [Activity Logs]
      summary: 🛡️ Get recent 50 activity log entries (admin only)
      responses:
        '200':
          description: Recent activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/activity-logs/by-user:
    get:
      tags: [Activity Logs]
      summary: 🛡️ Get activity logs for a specific user (admin only)
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            example: 5
      responses:
        '200':
          description: Activity logs for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── Admin Users ───────────────────────────────────────────────────────────────
  # /api/admin/** → hasAnyAuthority("admin","ADMIN")

  /api/admin/users:
    post:
      tags: [Admin Users]
      summary: 🛡️ Create a user and email auto-generated credentials (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, phone]
              properties:
                firstName:
                  type: string
                  example: Maria
                lastName:
                  type: string
                  example: Santos
                email:
                  type: string
                  example: maria@example.com
                phone:
                  type: string
                  example: "09181234567"
                role:
                  type: string
                  enum: [user, admin]
                  default: user
      responses:
        '201':
          description: User created and credentials emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User created and credentials emailed to maria@example.com
                  userId:
                    type: integer
                    example: 12
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

# ═══════════════════════════════════════════════════════════════════════════════
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued by /api/auth/login. Also accepted via HttpOnly cookie "jwt".
        Roles: user | admin. Admin routes require authority "admin" or "ADMIN".

  parameters:
    IntIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        example: 1

    LongIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1

    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        example: 3

    UserIdOrMe:
      name: id
      in: path
      required: true
      description: Numeric user ID or the literal string "me" (resolves to the caller)
      schema:
        type: string
        example: me

  responses:
    BadRequest:
      description: Bad request – validation or missing fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Missing required fields.

    Unauthorized:
      description: Unauthorized – missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized

    Forbidden:
      description: Forbidden – valid JWT but insufficient role (not admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Forbidden

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Resource not found.

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: An unexpected server error occurred.

  schemas:

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred.

    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful.

    UserDto:
      type: object
      properties:
        id:
          type: integer
          example: 3
        firstName:
          type: string
          example: Juan
        lastName:
          type: string
          example: Dela Cruz
        email:
          type: string
          example: juan@example.com
        phone:
          type: string
          example: "09171234567"
        address:
          type: string
          example: 123 Rizal St
        city:
          type: string
          example: Manila
        province:
          type: string
          example: Metro Manila
        zip:
          type: string
          example: "1000"
        role:
          type: string
          example: user
        status:
          type: string
          example: approved
        isActive:
          type: integer
          example: 1
        idFileName:
          type: string
          example: national_id.jpg
        hasIdFile:
          type: boolean
          example: true
        photoUrl:
          type: string
          example: /api/users/3/photo
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"

    Animal:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Buddy
        type:
          type: string
          example: Dog
        breed:
          type: string
          example: Labrador
        age:
          type: string
          example: 2 years
        health:
          type: string
          example: Healthy
        status:
          type: string
          example: Available
        photo:
          type: string
          example: uploads/buddy.jpg
        notes:
          type: string
          example: Vaccinated and friendly

    AnimalRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Buddy
        type:
          type: string
          example: Dog
        breed:
          type: string
          example: Labrador
        age:
          type: string
          example: 2 years
        health:
          type: string
          example: Healthy
        status:
          type: string
          example: Available
        photo:
          type: string
          example: uploads/buddy.jpg
        notes:
          type: string
          example: Friendly and vaccinated

    AdoptionRequest:
      type: object
      required: [petName, name, email, phone, address, reason, userId]
      properties:
        petName:
          type: string
          example: Buddy
        name:
          type: string
          example: Juan Dela Cruz
        email:
          type: string
          example: juan@example.com
        phone:
          type: string
          example: "09171234567"
        address:
          type: string
          example: 123 Rizal St, Manila
        reason:
          type: string
