spring.application.name=pawster

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_schema=public
spring.flyway.schemas=public

spring.jpa.hibernate.ddl-auto=validate

app.upload.dir=uploads/missing-pets

# ===============================
# FILE UPLOAD LIMITS
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=505MB
server.tomcat.max-http-form-post-size=505MB
server.tomcat.max-swallow-size=505MB

# ── App base URL ─────────────────────────────────────────────────────────────
app.base-url=http://localhost:3000

# ===============================
# DATABASE / FLYWAY CONFIG
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/pawster_db?currentSchema=public}
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
jwt.expiration=86400000

# ===============================
# JPA
# ===============================
spring.jpa.open-in-view=false

# ===============================
# DEVTOOLS
# ===============================
spring.devtools.restart.enabled=false

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=INFO


#=================================
google.client.id=764828654585-2mus78u3vsj13nma0259bb35t5ghloob.apps.googleusercontent.com

# ===============================
# MONGODB (messages)
# ===============================
spring.data.mongodb.uri=${MONGO_URI:mongodb://user:password@localhost:27017/pawster_messages?authSource=admin}
spring.data.mongodb.database=pawster_messages