spring.application.name=pawster

# ── Gmail SMTP (use App Password if 2FA is on) ──────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.upload.dir=uploads/missing-pets
# ===============================
# FILE UPLOAD LIMITS
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Temporary debug — remove after confirming
logging.level.org.springframework.boot.env=DEBUG

# ── App base URL (shown in welcome email) ────────────────────────────────────
app.base-url=http://localhost:3000

# ===============================
# DATABASE / FLYWAY CONFIG
# ===============================
# Note: 'db' is the service name defined in your docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5434/pawster_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway: Automatically run migrations on startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# JWT CONFIG
# ===============================
# This matches the @Value("${jwt.secret}") in your JwtUtils
# Use a Base64 encoded string (at least 256-bit)
jwt.secret=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
#24 hours
jwt.expiration=86400000 

# ===============================
# DEVTOOLS / DOCKER OPTIMIZATION
# ===============================
# Enable Hot Swapping
spring.devtools.restart.enabled=true
# Optional: Trigger restart only if a specific file changes (prevents loop)
# spring.devtools.restart.trigger-file=.trigger

# ===============================
# LOGGING (Useful for debugging JWT/Security)
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=INFO