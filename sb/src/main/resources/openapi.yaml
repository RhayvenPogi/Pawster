openapi: 3.0.0
info:
  title: Pawstar API
  version: 2.0.0
  description: >
    Full REST API for the Pawstar Spring Boot backend.
    Security rules are derived directly from SecurityConfig.java.

    🔓 Public      = no token required
    🔐 Auth        = any valid JWT (user or admin)
    🛡️  Admin only  = JWT with role admin/ADMIN

    **Storage:** PostgreSQL (JPA) for all entities except Messages, which use MongoDB.
    **File uploads:** multipart/form-data; max 500 MB per request (configured in application.properties).
    **Auth transport:** JWT issued as HttpOnly cookie `jwt` on login/register.
    Bearer token in `Authorization` header also accepted as fallback.

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: 🔓 All public. `/me` returns 401 if no valid JWT. Google OAuth and profile-completion included.
  - name: Users
    description: 🔐 Authenticated — owner or admin
  - name: Animals
    description: GET public · POST(JSON)/mark-adopted/mark-pending/from-rehoming public · admin for other writes
  - name: Adoption
    description: POST/GET my-requests/DELETE auth · GET all/single/PATCH admin
  - name: Rehome
    description: POST/GET my-requests/DELETE auth · GET all/single/PATCH admin
  - name: Surveys
    description: POST/GET my-surveys auth · GET all/single admin
  - name: Missing Pets
    description: 🔓 GET approved & POST public · admin sub-routes require auth
  - name: Pet Comments
    description: 🔓 GET public · POST auth · DELETE auth
  - name: Messages (REST)
    description: 🔐 All authenticated. Admin-only endpoints noted individually.
  - name: Messages (WebSocket)
    description: >
      STOMP over SockJS at `/ws/chat`. Authenticate on CONNECT via
      `Authorization: Bearer <token>` or `token` STOMP header.
      Application prefix `/app`. Broker prefixes `/topic`, `/queue`, `/user`.
  - name: Activity Logs
    description: 🛡️ Admin only
  - name: Admin Users
    description: 🛡️ Admin only

# ═══════════════════════════════════════════════════════════════════════════════
paths:

  # ── Auth ─────────────────────────────────────────────────────────────────────

  /api/auth/login:
    post:
      tags: [Auth]
      summary: 🔓 Login with email and password (form fields)
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: juan@example.com
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Login successful — JWT set as HttpOnly cookie `jwt` and returned in body
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserDto'
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiJ9...
                      message:
                        type: string
                        example: Login successful!
                      role:
                        type: string
                        example: user
                      redirect:
                        type: string
                        example: php/index.php
                      profileComplete:
                        type: boolean
                        example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/register:
    post:
      tags: [Auth]
      summary: 🔓 Register a new user (multipart with ID file)
      description: >
        All fields are required. `idFile` must be JPG, PNG, or PDF under 5 MB.
        On success, a JWT cookie is set and the token is returned in the body.
        `profileComplete` is set to `true` for normal registration.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - phone
                - password
                - address
                - city
                - province
                - zip
                - idFile
              properties:
                firstName:
                  type: string
                  example: Juan
                lastName:
                  type: string
                  example: Dela Cruz
                email:
                  type: string
                  example: juan@example.com
                phone:
                  type: string
                  example: "09171234567"
                password:
                  type: string
                  description: Minimum 8 characters
                  example: secret123
                address:
                  type: string
                  example: 123 Rizal St
                city:
                  type: string
                  example: Manila
                province:
                  type: string
                  example: Metro Manila
                zip:
                  type: string
                  example: "1000"
                idFile:
                  type: string
                  format: binary
                  description: JPG, PNG, or PDF — max 5 MB
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserDto'
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: Registration successful!
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiJ9...
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/google:
    post:
      tags: [Auth]
      summary: 🔓 Login or register via Google ID token
      description: >
        Verifies a Google ID token. If the email is new, a user account is created
        with `profileComplete: false` — the frontend must redirect to complete-profile.
        On success, a JWT cookie is set and the token is returned in the body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Google ID token from the Google Sign-In SDK
                  example: eyJhbGciOiJSUzI1NiIsImtpZCI6...
      responses:
        '200':
          description: Google login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserDto'
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      token:
                        type: string
                      message:
                        type: string
                        example: Login successful!
                      redirect:
                        type: string
                        example: php/index.php
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/complete-profile:
    put:
      tags: [Auth]
      summary: 🔐 Complete profile for Google-authenticated users
      description: >
        Required for users who registered via Google OAuth and have
        `profileComplete: false`. Sets phone, address, and uploads ID file.
        Sets `profileComplete: true` on success.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [phone, address, city, province, zip, idFile]
              properties:
                phone:
                  type: string
                  example: "09171234567"
                  description: PH number format (09XXXXXXXXX or +639XXXXXXXXX)
                address:
                  type: string
                  example: 123 Rizal St
                city:
                  type: string
                  example: Manila
                province:
                  type: string
                  example: Metro Manila
                zip:
                  type: string
                  example: "1000"
                idFile:
                  type: string
                  format: binary
                  description: Government-issued ID — JPG, PNG, or PDF, max 5 MB
      responses:
        '200':
          description: Profile completed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserDto'
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: Profile completed successfully!
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 🔓 Logout (clears JWT cookie)
      security: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: 🔓 Get currently authenticated user (returns 401 if no valid JWT)
      description: >
        SecurityConfig marks this `permitAll`, but the handler inspects
        `SecurityContextHolder` and returns 401 for unauthenticated requests.
        Returns a static map for the hardcoded admin account.
      security: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: 🔓 Request a password-reset OTP (sent via Brevo/email)
      description: Always returns 200 to prevent email enumeration. OTP expires in 10 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: juan@example.com
      responses:
        '200':
          description: OTP sent (always 200 to prevent email enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/verify-otp:
    post:
      tags: [Auth]
      summary: 🔓 Verify the password-reset OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  example: juan@example.com
                otp:
                  type: string
                  example: "482910"
      responses:
        '200':
          description: OTP verified — `resetOtpVerified` flag set on user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: OTP expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: OTP has expired. Please request a new one.

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: 🔓 Reset password after OTP verification
      description: Requires `resetOtpVerified` to be true for the email. Clears OTP fields on success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, newPassword]
              properties:
                email:
                  type: string
                  example: juan@example.com
                newPassword:
                  type: string
                  description: Minimum 8 characters
                  example: NewPass@123
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/id-file/{userId}:
    get:
      tags: [Auth]
      summary: 🔐 Serve a user's uploaded ID file (inline, MIME-typed)
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: ID file bytes (PDF / JPG / PNG) — served inline with correct Content-Type
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Users ─────────────────────────────────────────────────────────────────────

  /api/users/{id}:
    get:
      tags: [Users]
      summary: 🔐 Get a user profile ("me" resolves to caller)
      parameters:
        - $ref: '#/components/parameters/UserIdOrMe'
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Users]
      summary: 🔐 Update profile text fields and optional photo; owner or admin only
      description: >
        Only provided fields are updated. Email changes are checked for uniqueness.
        Photo must be JPG, PNG, or WEBP under 5 MB.
      parameters:
        - $ref: '#/components/parameters/UserIdOrMe'
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                city:
                  type: string
                province:
                  type: string
                zip:
                  type: string
                photo:
                  type: string
                  format: binary
                  description: JPG, PNG, or WEBP — max 5 MB
      responses:
        '200':
          description: Updated user profile (DTO — no password hash or raw bytes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/{id}/password:
    put:
      tags: [Users]
      summary: 🔐 Change password; owner or admin only
      parameters:
        - $ref: '#/components/parameters/UserIdOrMe'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  example: oldpass123
                newPassword:
                  type: string
                  description: Minimum 8 characters
                  example: NewPass@456
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/{id}/id-file:
    get:
      tags: [Users]
      summary: 🔐 Download a user's ID file; owner or admin only
      parameters:
        - $ref: '#/components/parameters/UserIdOrMe'
      responses:
        '200':
          description: ID file bytes — served inline with correct Content-Type and Content-Disposition
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Users]
      summary: 🔐 Upload or replace a user's ID file; owner or admin only
      parameters:
        - $ref: '#/components/parameters/UserIdOrMe'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [idFile]
              properties:
                idFile:
                  type: string
                  format: binary
                  description: JPG, PNG, or PDF — max 5 MB
      responses:
        '200':
          description: ID file updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/{id}/photo:
    get:
      tags: [Users]
      summary: 🔐 Get profile photo bytes; owner or admin only
      parameters:
        - $ref: '#/components/parameters/UserIdOrMe'
      responses:
        '200':
          description: Photo image bytes with correct Content-Type
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/photo/public:
    get:
      tags: [Users]
      summary: 🔓 Get profile photo with no auth (cached 7 days via Cache-Control)
      description: Only accepts numeric IDs (not "me"). Returns 400 for non-numeric path segment.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Photo image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Animals ───────────────────────────────────────────────────────────────────

  /api/animals:
    get:
      tags: [Animals]
      summary: 🔓 Get all animals (optional type / status filter)
      security: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            example: Dog
        - name: status
          in: query
          required: false
          schema:
            type: string
            example: Available
      responses:
        '200':
          description: List of animals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnimalDto'

    post:
      tags: [Animals]
      summary: 🔓/🛡️ Create a new animal
      description: >
        SecurityConfig permits `POST /api/animals` without auth.
        The controller accepts both `multipart/form-data` (with optional `photo` file)
        and `application/json` (with optional `photoData` base64 + `photoType`).
        In practice, the admin panel uses the multipart variant.
        Wildcard `POST /api/animals/**` requires admin.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnimalRequestMultipart'
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalRequestJson'
      responses:
        '201':
          description: Animal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalDto'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/animals/from-rehoming:
    post:
      tags: [Animals]
      summary: 🔓 Create animal from an approved rehome request (called internally by Django)
      description: >
        Accepts JSON only. Accepts `photoData` (raw base64, no data URI prefix)
        and `photoType` (MIME). Forces `status: Available` and `health: Healthy`
        if not provided. Logged as actor `rehoming-approval`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalRequestJson'
      responses:
        '201':
          description: Animal created from rehoming approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalDto'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/animals/{id}:
    get:
      tags: [Animals]
      summary: 🔓 Get a single animal by ID
      security: []
      parameters:
        - $ref: '#/components/parameters/IntIdPath'
      responses:
        '200':
          description: Animal record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalDto'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Animals]
      summary: 🛡️ Update an animal (admin only)
      description: >
        Accepts both `multipart/form-data` and `application/json`.
        Photo is only replaced if a new one is provided; otherwise existing photo is kept.
      parameters:
        - $ref: '#/components/parameters/IntIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnimalRequestMultipart'
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalRequestJson'
      responses:
        '200':
          description: Updated animal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Animals]
      summary: 🛡️ Delete an animal (admin only)
      parameters:
        - $ref: '#/components/parameters/IntIdPath'
      responses:
        '200':
          description: Animal deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/animals/mark-adopted:
    post:
      tags: [Animals]
      summary: 🔓 Mark an animal as Adopted (called by Django after approval)
      description: >
        Finds the first animal with `status = Available OR Pending` whose name
        contains `animalName` (case-insensitive) and sets status to `Adopted`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [animalName]
              properties:
                animalName:
                  type: string
                  example: Buddy
      responses:
        '200':
          description: Result (success may be false if no matching animal found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/animals/mark-pending:
    post:
      tags: [Animals]
      summary: 🔓 Mark an animal as Pending (called by Django on adoption submission)
      description: >
        Finds the first animal with `status = Available` whose name contains
        `animalName` (case-insensitive) and sets status to `Pending`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [animalName]
              properties:
                animalName:
                  type: string
                  example: Buddy
      responses:
        '200':
          description: Result with `updated` flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  updated:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Animal is not available for adoption (already Pending or Adopted).
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Adoption ──────────────────────────────────────────────────────────────────

  /api/adoption:
    post:
      tags: [Adoption]
      summary: 🔐 Submit an adoption application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptionRequestBody'
      responses:
        '201':
          description: Application submitted — returns enriched DTO with user and animal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionRequestDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags: [Adoption]
      summary: 🛡️ Get all adoption applications (admin); optional status filter
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Pending, Approved, Rejected]
      responses:
        '200':
          description: List of enriched adoption applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdoptionRequestDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/adoption/my-requests:
    get:
      tags: [Adoption]
      summary: 🔐 Get the current user's adoption applications
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: User's enriched applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdoptionRequestDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/adoption/{id}:
    get:
      tags: [Adoption]
      summary: 🛡️ Get a single adoption application (admin)
      parameters:
        - $ref: '#/components/parameters/IntIdPath'
      responses:
        '200':
          description: Enriched adoption application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionRequestDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Adoption]
      summary: 🔐 Cancel an adoption application (authenticated user)
      parameters:
        - $ref: '#/components/parameters/IntIdPath'
      responses:
        '200':
          description: Application cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adoption/{id}/status:
    patch:
      tags: [Adoption]
      summary: 🛡️ Approve or reject an adoption application (admin)
      description: >
        When status is `Approved`, the matching animal is automatically set to `Adopted`
        (first Available or Pending animal whose name contains `petName`, case-insensitive).
      parameters:
        - $ref: '#/components/parameters/IntIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Approved, Rejected, Pending]
                  example: Approved
                rejectNote:
                  type: string
                  example: Pet already adopted.
      responses:
        '200':
          description: Updated enriched adoption application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionRequestDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Rehome ────────────────────────────────────────────────────────────────────

  /api/rehome:
    post:
      tags: [Rehome]
      summary: 🔐 Submit a rehome request
      description: >
        Full rehome form. Includes owner info, pet traits, vaccination status,
        and behavioral details. Status is forced to `Pending` on creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RehomeRequestBody'
      responses:
        '201':
          description: Rehome request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RehomeRequestDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags: [Rehome]
      summary: 🛡️ Get all rehome requests (admin); optional status filter
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Pending, Approved, Rejected]
      responses:
        '200':
          description: List of rehome requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RehomeRequestDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/rehome/my-requests:
    get:
      tags: [Rehome]
      summary: 🔐 Get the current user's rehome requests
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: User's rehome requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RehomeRequestDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/rehome/{id}:
    get:
      tags: [Rehome]
      summary: 🛡️ Get a single rehome request (admin)
      parameters:
        - $ref: '#/components/parameters/IntIdPath'
      responses:
        '200':
          description: Rehome request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RehomeRequestDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Rehome]
      summary: 🔐 Cancel a rehome request (authenticated user)
      parameters:
        - $ref: '#/components/parameters/IntIdPath'
      responses:
        '200':
          description: Rehome request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/rehome/{id}/status:
    patch:
      tags: [Rehome]
      summary: 🛡️ Approve or reject a rehome request (admin)
      parameters:
        - $ref: '#/components/parameters/IntIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Approved, Rejected, Pending]
                  example: Approved
                rejectNote:
                  type: string
                  example: Insufficient details provided.
      responses:
        '200':
          description: Updated rehome request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RehomeRequestDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Surveys ───────────────────────────────────────────────────────────────────

  /api/surveys:
    post:
