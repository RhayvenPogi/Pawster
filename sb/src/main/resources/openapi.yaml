  # ── Missing Pets ──────────────────────────────────────────────────────────────

  /api/missing-pets:
    get:
      tags: [Missing Pets]
      summary: 🔓 Get all approved missing pet reports
      security: []
      responses:
        '200':
          description: Approved missing pet reports (status = "approved")
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MissingPet'

    post:
      tags: [Missing Pets]
      summary: 🔓 Submit a new missing/found pet report (multipart)
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, species, area, address]
              properties:
                type:
                  type: string
                  example: missing
                name:
                  type: string
                  example: Buddy
                species:
                  type: string
                  example: Dog
                breed:
                  type: string
                  example: Labrador
                area:
                  type: string
                  example: Tondo, Manila
                address:
                  type: string
                  example: 123 Rizal Street
                color:
                  type: string
                  example: Brown
                details:
                  type: string
                  example: Last seen near the park wearing a red collar.
                latitude:
                  type: number
                  format: double
                  example: 14.5995
                longitude:
                  type: number
                  format: double
                  example: 120.9842
                reporterUserId:
                  type: integer
                  example: 3
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Report submitted (initial status is null/pending until admin approves)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingPet'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/missing-pets/admin/all:
    get:
      tags: [Missing Pets]
      summary: 🔐 Get all reports regardless of status (authenticated — admin recommended)
      responses:
        '200':
          description: All reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MissingPet'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/missing-pets/admin/{id}:
    put:
      tags: [Missing Pets]
      summary: 🔐 Admin update a report via JSON body
      description: Updates name, species, breed, color, area, address, and details.
      parameters:
        - $ref: '#/components/parameters/LongIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissingPetUpdateBody'
      responses:
        '200':
          description: Updated report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingPet'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [Missing Pets]
      summary: 🔐 Admin delete a report
      parameters:
        - $ref: '#/components/parameters/LongIdPath'
      responses:
        '204':
          description: Report deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/missing-pets/admin/{id}/approve:
    put:
      tags: [Missing Pets]
      summary: 🔐 Approve a missing pet report (sets status to "approved")
      parameters:
        - $ref: '#/components/parameters/LongIdPath'
      responses:
        '200':
          description: Report approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingPet'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/missing-pets/admin/{id}/reject:
    put:
      tags: [Missing Pets]
      summary: 🔐 Reject a missing pet report (sets status to "rejected")
      parameters:
        - $ref: '#/components/parameters/LongIdPath'
      responses:
        '200':
          description: Report rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingPet'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/missing-pets/{id}:
    put:
      tags: [Missing Pets]
      summary: 🔐 User updates their own report (multipart, optional new photo)
      parameters:
        - $ref: '#/components/parameters/LongIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, species, area, address]
              properties:
                type:
                  type: string
                name:
                  type: string
                species:
                  type: string
                breed:
                  type: string
                area:
                  type: string
                address:
                  type: string
                color:
                  type: string
                details:
                  type: string
                latitude:
                  type: number
                  format: double
                longitude:
                  type: number
                  format: double
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingPet'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/missing-pets/{id}/photo:
    get:
      tags: [Missing Pets]
      summary: 🔓 Serve a missing pet report photo (bytes, MIME-typed)
      security: []
      parameters:
        - $ref: '#/components/parameters/LongIdPath'
      responses:
        '200':
          description: Photo bytes with correct Content-Type
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/missing-pets/{id}/resolve:
    put:
      tags: [Missing Pets]
      summary: 🔐 User marks their report as resolved
      description: >
        Only the original reporter (`reporterUserId`) may resolve their own report.
        Sets `resolvedByUser: true`, `resolvedAt`, and `status: resolved`.
        Throws 403-equivalent SecurityException if caller is not the reporter.
      parameters:
        - $ref: '#/components/parameters/LongIdPath'
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Report resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingPet'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Pet Comments ──────────────────────────────────────────────────────────────

  /api/missing-pets/{petId}/comments:
    get:
      tags: [Pet Comments]
      summary: 🔓 Get all comments for a missing pet report (oldest first)
      security: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 10
      responses:
        '200':
          description: List of comments (serialized without full pet object)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetComment'

    post:
      tags: [Pet Comments]
      summary: 🔓 Add a comment to a missing pet report
      description: >
        SecurityConfig permits POST `/api/missing-pets/*/comments` without auth.
        Comments are only allowed on reports with `status = "approved"`.
      security: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetCommentRequest'
      responses:
        '200':
          description: Comment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetComment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/missing-pets/{petId}/comments/{commentId}:
    delete:
      tags: [Pet Comments]
      summary: 🔐 Delete a comment (authenticated — admin recommended)
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Comment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Messages (REST) ───────────────────────────────────────────────────────────

  /api/messages/history:
    get:
      tags: [Messages (REST)]
      summary: 🔐 Get conversation history (oldest first)
      description: >
        For regular users, returns their own conversation.
        For admin, returns the conversation for the specified `userId`.
        Messages are stored in MongoDB.
      parameters:
        - name: userId
          in: query
          required: false
          description: Target user ID (admin only — ignored for regular users)
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/messages/upload:
    post:
      tags: [Messages (REST)]
      summary: 🔐 Upload a message attachment (stored in PostgreSQL as BYTEA)
      description: >
        Stores the file in the `message_attachments` table and returns a URL
        at `/api/messages/attachment/{id}` to reference in a WebSocket message.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                targetUserId:
                  type: integer
                  description: Target user (optional, informational)
                  example: 3
      responses:
        '200':
          description: Attachment uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: /api/messages/attachment/42
                  type:
                    type: string
                    enum: [image, video, file]
                    example: image
                  fileName:
                    type: string
                    example: photo.jpg
                  fileSize:
                    type: integer
                    format: int64
                    example: 204800
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/messages/attachment/{id}:
    get:
      tags: [Messages (REST)]
      summary: 🔐 Serve a message attachment from the database
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 42
      responses:
        '200':
          description: Attachment bytes — cached 24 h (private)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/messages/read:
    post:
      tags: [Messages (REST)]
      summary: 🔐 Mark messages as read
      description: >
        For users: marks all admin→user messages as read for the caller.
        For admin: marks all user→admin messages as read for the given `userId`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                  description: Required when caller is admin
                  example: 3
      responses:
        '200':
          description: Messages marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/messages/unread-count:
    get:
      tags: [Messages (REST)]
      summary: 🔐 Get unread message count for the caller
      description: >
        For users: counts admin messages not yet read by the user.
        For admin: counts all user messages not yet read by admin across all conversations.
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int64
                    example: 5
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/messages/conversations:
    get:
      tags: [Messages (REST)]
      summary: 🛡️ Get conversation summaries for the admin inbox
      description: >
        Returns one entry per user with the latest message, timestamp,
        and unread count. Aggregated via MongoDB pipeline. Admin only.
      responses:
        '200':
          description: Conversation summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/messages/conversation/{userId}:
    delete:
      tags: [Messages (REST)]
      summary: 🛡️ Delete all messages in a conversation (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Conversation deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/messages/bot-reply:
    post:
      tags: [Messages (REST)]
      summary: 🔐 Send a bot reply message to the caller's conversation
      description: >
        Saves a message with `isBot: true` and `senderRole: admin`.
        Broadcasts to `/topic/user/{userId}` and `/topic/admin/inbox` via WebSocket.
        Sender is the first admin user found in the database, or falls back to caller's ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  example: Hello! How can I help you today?
      responses:
        '200':
          description: Bot reply sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Messages (WebSocket) ──────────────────────────────────────────────────────

  /ws/chat:
    get:
      tags: [Messages (WebSocket)]
      summary: 🔓 SockJS/STOMP endpoint — connect here to join the chat
      description: >
        **Connection:** `http://localhost:8080/ws/chat` via SockJS.
        JWT must be sent on `CONNECT` frame via `Authorization: Bearer <token>` or
        `token: <token>` STOMP header. The principal is stored in session so
        subsequent `SEND`/`SUBSCRIBE` frames reuse it automatically.

        **Application destinations (client → server):**

        | Destination | Handler | Description |
        |---|---|---|
        | `/app/chat.send` | `@MessageMapping` | Send a user message |
        | `/app/chat.admin.send` | `@MessageMapping` | Send admin or bot message |

        **Broker destinations (server → client):**

        | Topic | Description |
        |---|---|
        | `/topic/user/{userId}` | Real-time messages for a specific user |
        | `/topic/admin/inbox` | All messages — admin monitors this |

        **ChatMessage payload fields:**

        | Field | Type | Description |
        |---|---|---|
        | `content` | string | Message text |
        | `targetUserId` | integer | Required for `/app/chat.admin.send` |
        | `attachmentUrl` | string | URL from `/api/messages/upload` |
        | `attachmentType` | string | `image`, `video`, or `file` |
        | `isBot` | boolean | `true` to send as bot message |

        **Access control for `/app/chat.admin.send`:**
        Regular users may only send bot messages (`isBot: true`) targeting themselves.
        Admins may target any userId.
      security: []
      responses:
        '101':
          description: WebSocket upgrade (SockJS handles HTTP→WS)

  # ── Activity Logs ─────────────────────────────────────────────────────────────

  /api/admin/activity-logs:
    get:
      tags: [Activity Logs]
      summary: 🛡️ Get recent 50 activity log entries (admin only, newest first)
      responses:
