  # ── Admin Users ───────────────────────────────────────────────────────────────

  /api/admin/users:
    post:
      tags: [Admin Users]
      summary: 🛡️ Create a user and email auto-generated credentials (admin only)
      description: >
        Generates a 12-character random password (guaranteed uppercase, lowercase,
        digit, and special character) and emails it via Brevo.
        Sets `status: approved`, `isActive: 1`. Phone must be PH format `09XXXXXXXXX`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, phone]
              properties:
                firstName:
                  type: string
                  example: Maria
                lastName:
                  type: string
                  example: Santos
                email:
                  type: string
                  example: maria@example.com
                phone:
                  type: string
                  example: "09181234567"
                role:
                  type: string
                  enum: [user, admin]
                  default: user
                address:
                  type: string
                city:
                  type: string
                province:
                  type: string
                zip:
                  type: string
      responses:
        '201':
          description: User created and credentials emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User created and credentials emailed to maria@example.com
                  userId:
                    type: integer
                    example: 12
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

# ═══════════════════════════════════════════════════════════════════════════════
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued by `/api/auth/login`, `/api/auth/register`, or `/api/auth/google`.
        Delivered as HttpOnly cookie `jwt` (set automatically by browser) and also
        returned in the response body as `token`.
        Bearer token in `Authorization` header accepted as fallback (used by Axios in dev).
        Roles stored as JWT claim `role`. Admin routes require authority `admin` or `ADMIN`.
        Expiry: 86400000 ms (24 h).

  parameters:
    IntIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        example: 1

    LongIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1

    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        example: 3

    UserIdOrMe:
      name: id
      in: path
      required: true
      description: Numeric user ID or the literal string "me" (resolves to the JWT caller)
      schema:
        type: string
        example: me

  responses:
    BadRequest:
      description: Bad request — validation or missing fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Missing required fields.

    Unauthorized:
      description: Unauthorized — missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized

    Forbidden:
      description: Forbidden — valid JWT but insufficient role (not admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Forbidden

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Resource not found.

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: An unexpected server error occurred.

  schemas:

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred.

    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful.

    UserDto:
      description: >
        User data object returned by auth and user endpoints.
        Never includes `password` hash or raw file bytes.
      type: object
      properties:
        id:
          type: integer
          example: 3
        firstName:
          type: string
          example: Juan
        lastName:
          type: string
          example: Dela Cruz
        email:
          type: string
          example: juan@example.com
        phone:
          type: string
          example: "09171234567"
        address:
          type: string
          example: 123 Rizal St
        city:
          type: string
          example: Manila
        province:
          type: string
          example: Metro Manila
        zip:
          type: string
          example: "1000"
        role:
          type: string
          example: user
        status:
          type: string
          example: approved
        isActive:
          type: integer
          example: 1
        idFileName:
          type: string
          example: national_id.jpg
        hasIdFile:
          type: boolean
          description: Present in UserController DTO; indicates ID file is stored without sending bytes
          example: true
        photoUrl:
          type: string
          description: Relative URL to photo endpoint, or empty string if no photo
          example: /api/users/3/photo
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        profileComplete:
          type: boolean
          description: False for Google users who have not yet submitted the complete-profile form
          example: true

    AnimalDto:
      description: >
        Animal response object. Photo is returned as raw base64 (`photoData`) plus
        MIME type (`photoType`) — NOT a URL. Frontend renders as
        `data:{photoType};base64,{photoData}`.
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Buddy
        type:
          type: string
          example: Dog
        breed:
          type: string
          example: Labrador
        age:
          type: string
          example: 2 years
        health:
          type: string
          example: Healthy
        status:
          type: string
          enum: [Available, Pending, Adopted]
          example: Available
        notes:
          type: string
          example: Vaccinated and friendly
        photoData:
          type: string
          description: Base64-encoded photo bytes (no data URI prefix). Null if no photo.
          example: /9j/4AAQSkZJRgABAQAA...
        photoType:
          type: string
          description: MIME type of the photo
          example: image/jpeg

    AnimalRequestMultipart:
      description: Animal create/update payload as multipart (photo via file upload)
      type: object
      properties:
        data:
          description: JSON part containing animal fields (sent as `@RequestPart("data")`)
          type: string
          format: binary
        photo:
          type: string
          format: binary
          description: Optional photo file (JPG, PNG, etc.)

    AnimalRequestJson:
      description: Animal create/update payload as JSON (photo via base64 fields)
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Buddy
        type:
          type: string
          example: Dog
        breed:
          type: string
          example: Labrador
        age:
          type: string
          example: 2 years
        health:
          type: string
          example: Healthy
        status:
          type: string
          example: Available
        notes:
          type: string
          example: Friendly and vaccinated
        photoData:
          type: string
          description: >
            Raw base64-encoded photo (no data URI prefix, e.g. no "data:image/jpeg;base64,").
            If a data URI prefix is present it is stripped automatically.
          example: /9j/4AAQSkZJRgABAQAA...
        photoType:
          type: string
          description: MIME type for photoData
          example: image/jpeg
        removePhoto:
          type: boolean
          description: Set true to explicitly remove the existing photo
          example: false

    AdoptionRequestBody:
      description: Request body for submitting an adoption application
      type: object
      required: [petName, name, email, phone, address, reason, userId]
      properties:
        petName:
          type: string
          example: Buddy
        name:
          type: string
          description: Full name of the applicant
          example: Juan Dela Cruz
        email:
          type: string
          example: juan@example.com
        phone:
          type: string
          example: "09171234567"
        address:
          type: string
          example: 123 Rizal St, Manila
        reason:
          type: string
          example: I want to give Buddy a loving home.
        userId:
          type: integer
          example: 3

    AdoptionRequestDto:
      description: >
        Enriched adoption application returned by all read endpoints.
        Joined with User and Animal tables for convenience.
        `animalPhoto` is a ready-to-use data URL (`data:{mime};base64,{bytes}`).
      type: object
      properties:
        id:
          type: integer
          example: 5
        userId:
          type: integer
          example: 3
        petName:
          type: string
          example: Buddy
        name:
          type: string
          example: Juan Dela Cruz
        email:
          type: string
          example: juan@example.com
        phone:
          type: string
          example: "09171234567"
        address:
          type: string
          example: 123 Rizal St, Manila
        reason:
          type: string
          example: I want to give Buddy a loving home.
        status:
          type: string
          enum: [Pending, Approved, Rejected]
          example: Pending
        rejectNote:
          type: string
          example: ""
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        userFirstName:
          type: string
          example: Juan
        userLastName:
          type: string
          example: Dela Cruz
        userEmail:
          type: string
          example: juan@example.com
        animalType:
          type: string
          example: Dog
        animalBreed:
          type: string
          example: Labrador
        animalAge:
          type: string
          example: 2 years
        animalHealth:
          type: string
          example: Healthy
        animalPhoto:
          type: string
          description: >
            Computed field — full data URL ready for `<img src>`.
            Null if no photo is stored. Raw bytes not exposed.
          example: "data:image/jpeg;base64,/9j/4AAQ..."

    RehomeRequestBody:
      description: Full rehome request form payload
      type: object
      properties:
        userId:
          type: integer
          example: 3
        ownerName:
          type: string
          example: Maria Santos
        contact:
          type: string
          description: Owner email
          example: maria@example.com
        contactNo:
          type: string
          description: Owner phone
          example: "09181234567"
        city:
          type: string
          example: Quezon City
        petName:
          type: string
          example: Max
        species:
          type: string
          example: Cat
        breed:
          type: string
          example: Siamese
        age:
          type: string
          example: 3 years
        photoBase64:
          type: string
          description: Base64-encoded pet photo stored as text in DB
          example: /9j/4AAQSkZJRgABAQAA...
        behavior:
          type: string
          example: Friendly, Playful
        behaviorOther:
          type: string
        medicalNotes:
          type: string
          example: Allergic to certain foods
        idealHomeDesc:
          type: string
          example: A quiet home with no other pets
        goodWithChildren:
          type: boolean
          example: true
        goodWithPets:
          type: boolean
          example: false
        isHouseTrained:
          type: boolean
          example: true
        isLeashTrained:
          type: boolean
          example: false
        isVaccinated:
          type: boolean
          example: true
        vaccineType:
          type: string
          example: Rabies, FVRCP

    RehomeRequestDto:
      description: Rehome request as returned by the API
      type: object
      properties:
        id:
          type: integer
          example: 2
        userId:
          type: integer
          example: 3
        ownerName:
          type: string
          example: Maria Santos
        contact:
          type: string
          example: maria@example.com
        contactNo:
          type: string
          example: "09181234567"
        city:
          type: string
          example: Quezon City
        petName:
          type: string
          example: Max
        species:
          type: string
          example: Cat
        breed:
          type: string
          example: Siamese
        age:
          type: string
          example: 3 years
        photoBase64:
          type: string
        behavior:
          type: string
        behaviorOther:
          type: string
        medicalNotes:
          type: string
        idealHomeDesc:
          type: string
        goodWithChildren:
          type: boolean
        goodWithPets:
          type: boolean
        isHouseTrained:
          type: boolean
        isLeashTrained:
          type: boolean
        isVaccinated:
          type: boolean
        vaccineType:
          type: string
        status:
          type: string
          enum: [Pending, Approved, Rejected]
          example: Pending
        rejectNote:
          type: string
          example: ""
        createdAt:
          type: string
          format: date-time
          example: "2024-02-01T09:00:00Z"

    SurveyBody:
      description: Post-adoption survey request body
      type: object
      properties:
        adoptionId:
          type: integer
          example: 5
        userId:
          type: integer
          example: 3
        adopterName:
          type: string
          example: Juan Dela Cruz
        animalName:
          type: string
          example: Buddy
        rating:
          type: integer
          format: int16
          minimum: 1
          maximum: 5
          example: 5
        notes:
          type: string
          example: Amazing experience. Buddy is thriving!

    Survey:
      description: Survey as returned by the API
      type: object
      properties:
        id:
          type: integer
          example: 1
        adoptionId:
          type: integer
          example: 5
        userId:
          type: integer
          example: 3
        adopterName:
          type: string
          example: Juan Dela Cruz
        animalName:
          type: string
          example: Buddy
        rating:
          type: integer
          format: int16
          example: 5
        notes:
          type: string
          example: Amazing experience. Buddy is thriving!
        createdAt:
          type: string
          format: date-time
          example: "2024-03-01T12:00:00Z"

    MissingPet:
      description: Missing or found pet report
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        type:
          type: string
          enum: [missing, found]
          example: missing
        name:
          type: string
          example: Buddy
        species:
          type: string
          example: Dog
        breed:
          type: string
          example: Labrador
        area:
          type: string
          example: Tondo, Manila
        address:
          type: string
          example: 123 Rizal Street
        color:
          type: string
          example: Brown
        details:
          type: string
          example: Last seen near the park wearing a red collar.
        reportedDate:
          type: string
          format: date
          description: Auto-set on persist (LocalDate)
          example: "2024-04-01"
        latitude:
          type: number
          format: double
          example: 14.5995
        longitude:
          type: number
          format: double
          example: 120.9842
        status:
          type: string
          enum: [approved, rejected, resolved]
          example: approved
        reporterUserId:
          type: integer
          example: 3
        resolvedByUser:
          type: boolean
          example: false
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        photo:
          type: string
          description: >
            Raw byte array (bytea in DB). Not directly exposed in JSON responses.
            Access the photo via `/api/missing-pets/{id}/photo`.
          readOnly: true
        photoType:
          type: string
          example: image/jpeg

    MissingPetUpdateBody:
      description: Fields updatable by admin via JSON body
      type: object
      properties:
        name:
          type: string
        species:
          type: string
        breed:
          type: string
        color:
          type: string
        area:
          type: string
        address:
          type: string
        details:
          type: string

    PetComment:
      description: Comment on a missing pet report (serialized without lazy pet reference)
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          nullable: true
          description: Null if the user account was deleted
          example: 3
        authorName:
          type: string
          example: Maria Santos
        content:
          type: string
          example: I think I saw this dog near SM Mall!
        createdAt:
          type: string
          format: date-time
          example: "2024-04-02T10:00:00Z"

    PetCommentRequest:
      type: object
      required: [userId, content]
      properties:
        userId:
          type: integer
          example: 3
        authorName:
          type: string
          example: Maria Santos
        content:
          type: string
          example: I think I saw this dog near SM Mall!

    ActivityLog:
      description: >
        Audit trail entry created by services via ActivityLogService.
        Stored in PostgreSQL `activity_logs` table.
      type: object
      properties:
        id:
          type: integer
          example: 100
        action:
          type: string
          description: Short action code (e.g. ADOPTION_REQUEST, ADD_ANIMAL, LOGIN)
          example: ADOPTION_REQUEST
        details:
          type: string
          description: Human-readable description of the event
          example: "New adoption request for: Buddy by Juan Dela Cruz"
        userId:
          type: integer
          nullable: true
          example: 3
        userName:
          type: string
          nullable: true
          example: Juan Dela Cruz
        createdAt:
          type: string
          format: date-time
          example: "2024-04-03T14:30:00Z"

    MessageResponse:
      description: Message document from MongoDB
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectId
          example: "6642a1b2c3d4e5f6a7b8c9d0"
        userId:
          type: integer
          description: The conversation owner (user side of the admin↔user chat)
          example: 3
        senderId:
          type: integer
          example: 3
        senderRole:
          type: string
          enum: [user, admin]
          example: user
        senderName:
          type: string
          example: Juan Dela Cruz
        content:
          type: string
          example: Hello, I have a question about my adoption.
        isRead:
          type: boolean
          example: false
        isBot:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 instant (UTC)
          example: "2024-04-10T08:00:00Z"
        attachmentUrl:
          type: string
          nullable: true
          example: /api/messages/attachment/42
        attachmentType:
          type: string
          nullable: true
          enum: [image, video, file]
          example: image

    ConversationSummary:
      description: Admin inbox entry — one per user, aggregated via MongoDB pipeline
      type: object
      properties:
        userId:
          type: integer
          example: 3
        userName:
          type: string
          example: Juan Dela Cruz
        lastMessage:
          type: string
          example: Hello, I have a question about my adoption.
        lastMessageAt:
          type: string
          format: date-time
          example: "2024-04-10T08:00:00Z"
        unreadCount:
          type: integer
          format: int64
          example: 2