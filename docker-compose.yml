services:

  # ── Postgres — shared by Spring Boot, PHP, and Django ──────────────────────
  db:
    image: postgres:15-alpine
    container_name: pawster_postgres_db
    environment:
      POSTGRES_DB: pawster_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pawster_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Redis — Celery broker ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pawster_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Django API ──────────────────────────────────────────────────────────────
  django:
    build:
      context: ./django
      dockerfile: Dockerfile
    container_name: pawster_django_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=pawster.settings
      - DJANGO_SECRET_KEY=django-super-secret-change-in-production
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=pawster_db
      - DB_USER=user
      - DB_PASSWORD=password
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,django
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - JWT_SECRET=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
      - BREVO_API_KEY=${BREVO_API_KEY}
      - APP_BASE_URL=http://localhost:3000
      - SPRING_BOOT_API=http://sb:8080
    volumes:
      - ./django:/app
    working_dir: /app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # ── Celery Worker — processes async tasks (survey creation, emails) ─────────
  celery_worker:
    build:
      context: ./django
      dockerfile: Dockerfile
    container_name: pawster_celery_worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=pawster.settings
      - DJANGO_SECRET_KEY=django-super-secret-change-in-production
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=pawster_db
      - DB_USER=user
      - DB_PASSWORD=password
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - JWT_SECRET=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
      - BREVO_API_KEY=${BREVO_API_KEY}
      - APP_BASE_URL=http://localhost:3000
    volumes:
      - ./django:/app
    working_dir: /app
    command: celery -A pawster worker --loglevel=info

  # ── Celery Beat — triggers survey scheduler every 10s ──────────────────────
  celery_beat:
    build:
      context: ./django
      dockerfile: Dockerfile
    container_name: pawster_celery_beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=pawster.settings
      - DJANGO_SECRET_KEY=django-super-secret-change-in-production
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=pawster_db
      - DB_USER=user
      - DB_PASSWORD=password
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - JWT_SECRET=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
      - BREVO_API_KEY=${BREVO_API_KEY}
      - APP_BASE_URL=http://localhost:3000
    volumes:
      - ./django:/app
    working_dir: /app
    command: >
      celery -A pawster beat --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ── Spring Boot — auth + animals ────────────────────────────────────────────
  sb:
    image: eclipse-temurin:17-jdk-alpine
    container_name: pawster_springboot_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/pawster_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - JWT_SECRET=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - BREVO_API_KEY=${BREVO_API_KEY}
      - APP_BASE_URL=http://localhost:3000
    volumes:
      - ./sb:/app
      - ~/.m2:/root/.m2
      - ./sb/uploads:/app/uploads
    working_dir: /app
    command: ./mvnw spring-boot:run

  # ── PHP API ─────────────────────────────────────────────────────────────────
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: pawster_php_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=pawster_db
      - JWT_SECRET=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
    volumes:
      - ./php:/var/www/html
      - php_vendor:/var/www/html/vendor

  # ── React Frontend ───────────────────────────────────────────────────────────
  react:
    image: node:20-alpine
    container_name: pawster_react_front
    depends_on:
      - sb
      - django
    ports:
      - "3000:5173"
    environment:
      - VITE_API_BASE=http://localhost:8080
      - VITE_DJANGO_API=http://localhost:8082
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./react:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  postgres_data:
  php_vendor: