# ── Shared Django/Celery env anchor ───────────────────────────────────────────
x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: pawster.settings
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DEBUG: ${DEBUG}
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB}
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  BREVO_API_KEY: ${BREVO_API_KEY}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}

services:

  # ── Service Registry ──────────────────────────────────────────────────────
  eureka-server:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: pawster_eureka_server
    ports:
      - "8761:8761"
    volumes:
      - ./eureka-server:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: mvn spring-boot:run
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ── API Gateway ───────────────────────────────────────────────────────────
  api-gateway:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: pawster_api_gateway
    depends_on:
      eureka-server:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./api-gateway:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: mvn spring-boot:run

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: pawster_postgres_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pawster_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: pawster_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot ───────────────────────────────────────────────────────────
  sb:
    image: eclipse-temurin:17-jdk-alpine
    container_name: pawster_springboot_app
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - BREVO_API_KEY=${BREVO_API_KEY}
      - APP_BASE_URL=${APP_BASE_URL_FRONTEND}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
    volumes:
      - ./sb:/app
      - ~/.m2:/root/.m2
      - ./sb/uploads:/app/uploads
    working_dir: /app
    command: ./mvnw spring-boot:run

  # ── PHP ───────────────────────────────────────────────────────────────────
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: pawster_php_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./php:/var/www/html
      - php_vendor:/var/www/html/vendor

  # ── Django ────────────────────────────────────────────────────────────────
  django:
    build:
      context: ./django
      dockerfile: Dockerfile
    container_name: pawster_django_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *django-env
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_BASE_URL: ${APP_BASE_URL_BACKEND}
      SPRING_BOOT_API: http://sb:8080
    volumes:
      - ./django:/app
    working_dir: /app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8001"
    healthcheck:
      test: ["CMD-SHELL", "python manage.py showmigrations django_celery_beat | grep -q '\\[X\\]'"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Celery Worker ─────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./django
      dockerfile: Dockerfile
    container_name: pawster_celery_worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_healthy
    environment:
      <<: *django-env
      APP_BASE_URL: ${APP_BASE_URL_FRONTEND}
    volumes:
      - ./django:/app
    working_dir: /app
    command: celery -A pawster worker --loglevel=info

  # ── Celery Beat ───────────────────────────────────────────────────────────
  celery_beat:
    build:
      context: ./django
      dockerfile: Dockerfile
    container_name: pawster_celery_beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_healthy
    environment:
      <<: *django-env
      APP_BASE_URL: ${APP_BASE_URL_FRONTEND}
    volumes:
      - ./django:/app
    working_dir: /app
    command: >
      celery -A pawster beat --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ── Ollama ────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama
    container_name: pawster_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
       sleep 5 &&
       ollama pull llama3.2 &&
       wait"

  # ── React Frontend ────────────────────────────────────────────────────────
  react:
    image: node:20-alpine
    container_name: pawster_react_front
    depends_on:
      - api-gateway
      - ollama
    ports:
      - "3000:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_DJANGO_API_URL=${VITE_DJANGO_API_URL}
      - VITE_PHP_API_URL=${VITE_PHP_API_URL}
      - VITE_OLLAMA_URL=${VITE_OLLAMA_URL}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./react:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm install lottie-web && npm run dev -- --host"

volumes:
  postgres_data:
  php_vendor:
  ollama_data:
  mongodb_data: