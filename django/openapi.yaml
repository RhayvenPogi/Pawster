openapi: 3.0.3

info:
  title: Pawster Django API
  version: 2.0.0
  description: |
    REST API for the Pawster pet adoption platform.
    Handles adoption requests, rehoming requests, follow-up surveys, and in-app notifications.

    ## Authentication
    All protected endpoints require a `Bearer` JWT issued by the Spring Boot auth service.
    Pass it in the `Authorization` header: `Authorization: Bearer <token>`

    The JWT is verified using the shared `JWT_SECRET` (HS256). On first sight, Django
    auto-creates a local `User` row matched by the token's `sub` claim.

    ## Admin access
    Endpoints marked **(admin)** require the JWT to carry a role of `ROLE_ADMIN`, `ADMIN`,
    or `admin` in the `roles` claim.

    ## Survey schedule
    After an adoption is approved, three follow-up surveys are automatically created:
    `7_day` (due 30 s after adoption), `30_day` (60 s), and `90_day` (90 s).
    A Celery Beat task runs every 10 s to notify adopters when surveys become due.

servers:
  - url: http://localhost:8001
    description: Local development — Django direct
  - url: http://localhost:8000
    description: Through API Gateway (recommended)

security:
  - BearerAuth: []

tags:
  - name: Adoptions
    description: Submit and manage pet adoption requests.
  - name: Rehoming
    description: Submit and manage pet rehoming / rescue-surrender requests.
  - name: Surveys
    description: Follow-up surveys sent at 7, 30, and 90 days after adoption approval.
  - name: Notifications
    description: In-app notification inbox for adopters.
  - name: Users
    description: Public user-photo endpoint.
  - name: Meta
    description: OpenAPI schema and documentation UIs.

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 JWT issued by the Spring Boot auth service.

  parameters:
    IntId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Primary key of the resource.

  schemas:

    # ── Shared address sub-fields ─────────────────────────────────────────
    AddressFields:
      type: object
      properties:
        street_address: { type: string, maxLength: 255, default: "" }
        city:           { type: string, maxLength: 120, default: "" }
        province:       { type: string, maxLength: 120, default: "" }
        zip_code:       { type: string, maxLength: 20,  default: "" }
        address:        { type: string, description: "Raw address fallback.", default: "" }

    # ── AdoptionRequest ───────────────────────────────────────────────────
    AdoptionRequest:
      allOf:
        - $ref: '#/components/schemas/AddressFields'
        - type: object
          properties:
            id:          { type: integer, readOnly: true }
            user:        { type: integer, readOnly: true, nullable: true, description: "Django user PK of the applicant." }
            animal_id:   { type: integer }
            animal_name: { type: string, maxLength: 120 }
            name:        { type: string, maxLength: 200 }
            phone:       { type: string, maxLength: 30 }
            email:       { type: string, format: email }
            reason:      { type: string }

            previous_pet:         { type: boolean, nullable: true }
            previous_pet_details: { type: string }

            primary_caregiver: { type: string, maxLength: 50 }
            housing:           { type: string, maxLength: 50 }
            owns_home:         { type: boolean, nullable: true }
            pet_permission:    { type: boolean, nullable: true }
            pet_space:         { type: string, maxLength: 60 }
            household_size:    { type: string, maxLength: 20 }

            has_children:  { type: boolean, nullable: true }
            children_ages: { type: string, maxLength: 50 }

            has_other_pets:        { type: boolean, nullable: true }
            other_pets_detail:     { type: string, maxLength: 120 }
            other_pets_vaccinated: { type: boolean, nullable: true }

            introduction_plan: { type: string }
            exp:               { type: string, maxLength: 50 }
            alone_hours:       { type: string, maxLength: 30 }
            backup_care:       { type: string, maxLength: 50 }
            budget:            { type: string, maxLength: 20 }
            vet_plan:          { type: string }

            behavior_response: { type: string, maxLength: 60 }
            open_to_guidance:  { type: boolean, nullable: true }

            agree_proper_care: { type: boolean }
            agree_long_term:   { type: boolean }
            agree_no_abandon:  { type: boolean }
            agree_followup:    { type: boolean }

            status:
              type: string
              readOnly: true
              enum: [Pending, Approved, Rejected]
              default: Pending
            reject_note:   { type: string, readOnly: true }
            decided_by:    { type: integer, readOnly: true, nullable: true }
            decided_at:    { type: string, format: date-time, readOnly: true, nullable: true }
            adoption_date: { type: string, format: date-time, readOnly: true, nullable: true }
            created_at:    { type: string, format: date-time, readOnly: true }
            updated_at:    { type: string, format: date-time, readOnly: true }
          required:
            - animal_id
            - name
            - phone
            - email
            - reason

    # ── RehomingRequest ───────────────────────────────────────────────────
    RehomingRequest:
      allOf:
        - $ref: '#/components/schemas/AddressFields'
        - type: object
          properties:
            id:         { type: integer, readOnly: true }
            user:       { type: integer, readOnly: true, nullable: true }
            owner_name: { type: string, maxLength: 200, nullable: true, description: "Resolved from JWT if omitted." }
            photo_url:  { type: string, format: uri, nullable: true }

            pet_name: { type: string, maxLength: 120 }
            species:  { type: string, maxLength: 50 }
            breed:    { type: string, maxLength: 100 }
            age:      { type: string, maxLength: 50 }
            gender:   { type: string, maxLength: 20 }

            duration_owned: { type: string, maxLength: 30 }
            request_type:
              type: string
              enum: [rehome, rescue]
              default: rehome
              description: "'rehome' = owner surrender; 'rescue' = found/stray animal."
            found_location: { type: string, maxLength: 255, default: "" }

            is_vaccinated: { type: boolean, nullable: true }
            is_neutered:   { type: boolean, nullable: true }
            medical_notes: { type: string }

            vacc_photos:
              type: array
              items: { type: string }
              nullable: true
              description: "Array of base64-encoded vaccination record images. Cleared in list responses."
            vaccine_type:   { type: string, nullable: true }
            last_vacc_date: { type: string, format: date, nullable: true }
            vacc_clinic:    { type: string, nullable: true }
            vacc_notes:     { type: string, nullable: true }

            behavior:       { type: string, maxLength: 30 }
            behavior_other: { type: string, maxLength: 100 }

            has_aggression:     { type: boolean, nullable: true }
            is_house_trained:   { type: boolean, nullable: true }
            is_leash_trained:   { type: boolean, nullable: true }
            good_with_children: { type: boolean, nullable: true }
            good_with_pets:     { type: boolean, nullable: true }

            ideal_home_desc:    { type: string }
            contact:            { type: string, maxLength: 50 }

            reason:             { type: string, maxLength: 80 }
            details:            { type: string }
            tried_alternatives: { type: string }

            can_provide_food:      { type: boolean, default: false }
            can_provide_carrier:   { type: boolean, default: false }
            can_provide_records:   { type: boolean, default: false }
            understands_permanent: { type: boolean, default: false }
            open_to_followup:      { type: boolean, default: true }

            photo_base64:
              type: string
              nullable: true
              description: "Base64-encoded pet photo (may include data: URI prefix). Cleared in list responses."

            status:
              type: string
              readOnly: true
              enum: [Pending, Approved, Rejected]
              default: Pending
            reject_note: { type: string, readOnly: true }
            decided_by:  { type: integer, readOnly: true, nullable: true }
            decided_at:  { type: string, format: date-time, readOnly: true, nullable: true }
            created_at:  { type: string, format: date-time, readOnly: true }
            updated_at:  { type: string, format: date-time, readOnly: true }
          required:
            - pet_name
            - species
            - age
            - gender
            - contact

    # ── RehomingListItem — list view strips base64 blobs ──────────────────
    RehomingListItem:
      allOf:
        - $ref: '#/components/schemas/RehomingRequest'
        - type: object
          properties:
            has_photo:
              type: boolean
              description: "True when the original submission included a photo."
            vacc_photo_count:
              type: integer
              description: "Number of vaccination record photos on file."
            photo_base64:
              type: string
              nullable: true
              description: "Always null in list responses. Use the detail endpoint for actual data."
            vacc_photos:
              type: array
              items: { type: string }
              nullable: true
              description: "Always empty in list responses. Use the detail endpoint for actual data."

    # ── FollowUpSurvey ────────────────────────────────────────────────────
    FollowUpSurvey:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        survey_type:
          type: string
          enum: ["7_day", "30_day", "90_day"]
          description: "Post-adoption check-in schedule."
        status:
          type: string
          enum: [Pending, Completed]
          default: Pending
        scheduled_for: { type: string, format: date-time }
        submitted_at:  { type: string, format: date-time, nullable: true }
        animal_name:   { type: string, readOnly: true }
        adoption_date: { type: string, format: date-time, readOnly: true, nullable: true }
        has_response:
          type: boolean
          readOnly: true
          description: "True when a SurveyResponse already exists for this survey."

    # ── SurveyResponseSubmit ──────────────────────────────────────────────
    SurveyResponseSubmit:
      type: object
      description: "Payload for POST /api/surveys/response/ (multipart/form-data)."
      properties:
        survey_id:
          type: integer
          description: "PK of the pending FollowUpSurvey to answer."
        adjustment:
          type: string
          enum: ["Very well", "Moderate", "Struggling"]
        behavioral_notes: { type: string }
        showing_illness:  { type: boolean, default: false }
        vet_visited:      { type: boolean, default: false }
        satisfied:        { type: boolean, default: true }
        needs_support:    { type: boolean, default: false }
        additional_notes: { type: string }
        rating:
          type: integer
          minimum: 1
          maximum: 5
          default: 5
        photos:
          type: array
          items: { type: string, format: binary }
          description: "Up to 5 pet photos. Stored as base64 in django_survey_photos."
          maxItems: 5
      required:
        - survey_id
        - adjustment
        - rating

    # ── SurveyPhoto ───────────────────────────────────────────────────────
    SurveyPhoto:
      type: object
      properties:
        id:            { type: integer }
        url:           { type: string, description: "data: URI ready to use as <img src>." }
        thumbnail_url: { type: string, description: "Same as url (no server-side resize)." }
        uploaded_at:   { type: string, format: date-time }

    # ── SurveyResponseAdmin ───────────────────────────────────────────────
    SurveyResponseAdmin:
      type: object
      properties:
        id:           { type: integer }
        survey:       { type: integer, description: "FK to FollowUpSurvey." }
        survey_type:  { type: string, enum: ["7_day", "30_day", "90_day"] }
        animal_name:  { type: string }
        adopter_name: { type: string }
        adopter_email: { type: string, format: email }
        adjustment:   { type: string, enum: ["Very well", "Moderate", "Struggling"] }
        behavioral_notes: { type: string }
        showing_illness:  { type: boolean }
        vet_visited:      { type: boolean }
        satisfied:        { type: boolean }
        needs_support:    { type: boolean }
        additional_notes: { type: string }
        rating:           { type: integer, minimum: 1, maximum: 5 }
        health_flag:      { type: boolean, description: "Mirror of showing_illness for quick filtering." }
        submitted_at:     { type: string, format: date-time }
        photos:
          type: array
          items: { $ref: '#/components/schemas/SurveyPhoto' }

    # ── Notification ──────────────────────────────────────────────────────
    Notification:
      type: object
      properties:
        id:    { type: integer, readOnly: true }
        title: { type: string, maxLength: 200 }
        body:  { type: string }
        notif_type:
          type: string
          enum:
            - adoption_approved
            - adoption_rejected
            - rehoming_approved
            - rehoming_rejected
            - survey_scheduled
            - survey_due
            - general
        is_read:    { type: boolean, default: false }
        created_at: { type: string, format: date-time, readOnly: true }

    # ── Common ────────────────────────────────────────────────────────────
    SuccessMessage:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors:  { type: object, additionalProperties: true }

    RejectBody:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: "Rejection reason. Required — request fails with 400 if blank." }

    UserPhotoResponse:
      type: object
      properties:
        success: { type: boolean }
        photo:   { type: string, description: "Photo URL or base64 data: URI resolved from the user's profile." }

  responses:
    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Admin role required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

# ─────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────
paths:

  # ════════════════════════════════════════════════════
  # ADOPTIONS
  # ════════════════════════════════════════════════════

  /api/approvals/adoptions/:
    post:
      tags: [Adoptions]
      summary: Submit an adoption request
      description: |
        Authenticated user submits a new adoption application.
        On success, calls Spring Boot `POST /api/animals/mark-pending` (best-effort, silent on failure).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdoptionRequest' }
      responses:
        "201":
          description: Request submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  id:      { type: integer }
                  message: { type: string, example: "Adoption request submitted." }
        "400":
          description: Validation error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/approvals/adoptions/admin/:
    get:
      tags: [Adoptions]
      summary: List all adoption requests (admin)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [Pending, Approved, Rejected]
          description: Filter by status.
      responses:
        "200":
          description: All adoption requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdoptionRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/approvals/adoptions/user/:
    get:
      tags: [Adoptions]
      summary: Get the current user's adoption requests
      responses:
        "200":
          description: The caller's adoption requests, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdoptionRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/approvals/adoptions/{id}/:
    get:
      tags: [Adoptions]
      summary: Get a single adoption request (admin)
      parameters:
        - { $ref: '#/components/parameters/IntId' }
      responses:
        "200":
          description: Adoption request detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/AdoptionRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/approvals/adoptions/{id}/approve/:
    post:
      tags: [Adoptions]
      summary: Approve an adoption request (admin)
      description: |
        Sets `status → Approved`, records `adoption_date = now()`.

        Side-effects (all best-effort, silent on failure):
        - Spring Boot `POST /api/animals/mark-adopted`.
        - Celery creates 3 follow-up surveys (7_day / 30_day / 90_day).
        - In-app `adoption_approved` notification for the adopter.
        - Approval email via Brevo.
      parameters:
        - { $ref: '#/components/parameters/IntId' }
      responses:
        "200":
          description: Adoption approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/approvals/adoptions/{id}/reject/:
    post:
      tags: [Adoptions]
      summary: Reject an adoption request (admin)
      description: |
        Sets `status → Rejected`, stores reason in `reject_note`.
        Side-effects: in-app `adoption_rejected` notification + rejection email via Brevo.
      parameters:
        - { $ref: '#/components/parameters/IntId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectBody' }
      responses:
        "200":
          description: Adoption rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
        "400":
          description: Rejection reason missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/approvals/adoptions/{id}/update/:
    patch:
      tags: [Adoptions]
      summary: Update an adoption request (admin)
      description: |
        Edits any field **except** `status`, `decided_by`, and `decided_at`
        (those are stripped server-side — use approve/reject endpoints).
        Sends an update notification email to the applicant.
      parameters:
        - { $ref: '#/components/parameters/IntId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdoptionRequest' }
      responses:
        "200":
          description: Request updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:    { $ref: '#/components/schemas/AdoptionRequest' }
        "400":
          description: Validation error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/approvals/adoptions/{id}/delete/:
    delete:
      tags: [Adoptions]
      summary: Delete an adoption request (admin)
      parameters:
        - { $ref: '#/components/parameters/IntId' }
      responses:
        "200":
          description: Request deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ════════════════════════════════════════════════════
  # REHOMING
  # ════════════════════════════════════════════════════

  /api/approvals/rehoming/:
    post:
      tags: [Rehoming]
      summary: Submit a rehoming / rescue request
      description: |
        `owner_name` is resolved from the JWT (`first_name + last_name` or `username`) if not supplied.
        Use `request_type: rescue` for found/stray animals; include `found_location` in that case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RehomingRequest' }
      responses:
        "201":
          description: Request submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  id:      { type: integer }
                  message: { type: string }
        "400":
          description: Validation error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/approvals/rehoming/admin/:
    get:
      tags: [Rehoming]
      summary: List all rehoming requests (admin)
      description: |
        `photo_base64` is set to `null` and `vacc_photos` to `[]` in this response for performance.
        `has_photo` (bool) and `vacc_photo_count` (int) are added instead.
        Use the detail endpoint `GET /api/approvals/rehoming/{id}/` to retrieve full base64 data.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [Pending, Approved, Rejected]
      responses:
        "200":
          description: Rehoming requests (photos stripped).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RehomingListItem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/approvals/rehoming/user/:
    get:
      tags: [Rehoming]
      summary: Get the current user's rehoming requests
      responses:
        "200":
          description: The caller's rehoming requests, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RehomingRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/approvals/rehoming/{id}/:
    get:
      tags: [Rehoming]
      summary: Get a single rehoming request with full photo data (admin)
      parameters:
        - { $ref: '#/components/parameters/IntId' }
      responses:
        "200":
          description: Full rehoming request including base64 photos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/RehomingRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/approvals/rehoming/{id}/approve/:
    post:
      tags: [Rehoming]
      summary: Approve a rehoming request (admin)
      description: |
        Sets `status → Approved`.

        Side-effects (best-effort, silent on failure):
        - `POST /api/animals/from-rehoming` to Spring Boot — creates an `Available` animal
          record including the base64 photo (extracted from `photo_base64` or `photo_url`).
        - In-app `rehoming_approved` notification.
        - Approval email via Brevo.
      parameters:
        - { $ref: '#/components/parameters/IntId' }
      responses:
        "200":
          description: Rehoming approved and pet added to listings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/approvals/rehoming/{id}/reject/:
    post:
      tags: [Rehoming]
      summary: Reject a rehoming request (admin)
      parameters:
        - { $ref: '#/components/parameters/IntId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectBody' }
      responses:
        "200":
          description: Rehoming rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
        "400":
          description: Rejection reason missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/approvals/rehoming/{id}/update/:
    patch:
      tags: [Rehoming]
      summary: Update a rehoming request (admin)
      description: |
        `status`, `decided_by`, and `decided_at` are stripped server-side.
        Sends an update notification email to the submitter.
      parameters:
        - { $ref: '#/components/parameters/IntId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RehomingRequest' }
      responses:
        "200":
          description: Request updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:    { $ref: '#/components/schemas/RehomingRequest' }
        "400":
          description: Validation error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/approvals/rehoming/{id}/delete/:
    delete:
      tags: [Rehoming]
      summary: Delete a rehoming request (admin)
      parameters:
        - { $ref: '#/components/parameters/IntId' }
      responses:
        "200":
          description: Request deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ════════════════════════════════════════════════════
  # SURVEYS
  # ════════════════════════════════════════════════════

  /api/surveys/user/:
    get:
      tags: [Surveys]
      summary: Get the current user's follow-up surveys
      description: Returns pending and completed surveys. Optionally filter by type.
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: ["7_day", "30_day", "90_day"]
          description: Filter by survey type.
      responses:
        "200":
          description: Survey lists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:       { type: boolean }
                  pending_count: { type: integer }
                  pending:
                    type: array
                    items: { $ref: '#/components/schemas/FollowUpSurvey' }
                  completed:
                    type: array
                    items: { $ref: '#/components/schemas/FollowUpSurvey' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/surveys/response/:
    post:
      tags: [Surveys]
      summary: Submit a follow-up survey response
      description: |
        Accepts `multipart/form-data`. Include up to **5** photo files under the key `photos`.

        - Marks the survey `Completed` and sets `submitted_at`.
        - Photos are base64-encoded and persisted to `django_survey_photos`.
        - Duplicate submissions are blocked by a OneToOne DB constraint.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SurveyResponseSubmit' }
      responses:
        "201":
          description: Response submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string, example: "Thank you for your feedback! 🐾" }
        "400":
          description: Validation error or survey already completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/surveys/admin/:
    get:
      tags: [Surveys]
      summary: List all submitted survey responses with photos (admin)
      parameters:
        - in: query
          name: survey_type
          schema:
            type: string
            enum: ["7_day", "30_day", "90_day"]
        - in: query
          name: health_flag
          schema:
            type: string
            enum: ["true"]
          description: Pass `true` to return only responses where `showing_illness` is true.
      responses:
        "200":
          description: All survey responses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count:   { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SurveyResponseAdmin' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/surveys/admin/pending/:
    get:
      tags: [Surveys]
      summary: List unanswered surveys (admin)
      parameters:
        - in: query
          name: survey_type
          schema:
            type: string
            enum: ["7_day", "30_day", "90_day"]
      responses:
        "200":
          description: Pending surveys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count:   { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FollowUpSurvey' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  # ════════════════════════════════════════════════════
  # NOTIFICATIONS
  # ════════════════════════════════════════════════════

  /api/notifications/:
    get:
      tags: [Notifications]
      summary: List notifications for the current user
      description: Returns the 40 most recent notifications plus the total unread count.
      responses:
        "200":
          description: Notification list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  unread_count:
                    type: integer
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/unread-count/:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      description: Lightweight endpoint. Polled by the NotificationBell component every 60 s.
      responses:
        "200":
          description: Unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:      { type: boolean }
                  unread_count: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/{id}/read/:
    post:
      tags: [Notifications]
      summary: Mark a single notification as read
      parameters:
        - { $ref: '#/components/parameters/IntId' }
      responses:
        "200":
          description: Marked as read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/notifications/read-all/:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All notifications marked read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  marked:  { type: integer, description: "Number of notifications updated." }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ════════════════════════════════════════════════════
  # USERS  (view lives in apps/approvals/views.py)
  # ════════════════════════════════════════════════════

  /api/users/{id}/photo/public/:
    get:
      tags: [Users]
      summary: Get a user's public profile photo
      security: []
      description: |
        No JWT required. Resolves the photo from `profile.photo`, `profile.photo_base64`,
        `profile.avatar`, or equivalent user-level attributes (first non-null wins).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: Django user PK.
      responses:
        "200":
          description: Photo found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPhotoResponse' }
        "404":
          description: User not found or no photo on file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ════════════════════════════════════════════════════
  # OpenAPI / Docs  (drf-spectacular)
  # ════════════════════════════════════════════════════

  /api/schema/:
    get:
      tags: [Meta]
      summary: Download the auto-generated OpenAPI schema (drf-spectacular)
      security: []
      responses:
        "200":
          description: OpenAPI 3.x YAML schema.
          content:
            application/vnd.oai.openapi:
              schema: { type: string }

  /api/docs/:
    get:
      tags: [Meta]
      summary: Swagger UI
      security: []
      responses:
        "200":
          description: Interactive Swagger UI HTML page.
          content:
            text/html:
              schema: { type: string }

  /api/redoc/:
    get:
      tags: [Meta]
      summary: ReDoc UI
      security: []
      responses:
        "200":
          description: ReDoc HTML page.
          content:
            text/html:
              schema: { type: string }