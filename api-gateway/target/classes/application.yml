server:
  port: 8000

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 510MB          # ← add this
  cloud:
    gateway:
      httpclient:
        max-response-size: 510MB       # ← add this
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Cache-Control
              - Content-Type
              - Accept
              - Upgrade
              - Connection
              - Sec-WebSocket-Key
              - Sec-WebSocket-Version
              - Sec-WebSocket-Extensions
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: websocket-service
          uri: http://sb:8080
          predicates:
            - Path=/ws/**
          filters:
            - RewritePath=/ws(?<segment>/?.*), /ws$\{segment}
        
        - id: django-user-photo
          uri: http://django:8001
          predicates:
            - Path=/api/users/*/photo/public/

        - id: springboot-service
          uri: lb://pawster
          predicates:
            - Path=/api/auth/**, /api/animals/**, /api/adoptions/**, /api/users/**, /api/admin/**, /api/rehome/**, /api/missing-pets/**, /api/activity-logs/**, /api/messages/**, /uploads/**

        - id: php-admin-service
          uri: http://php:80
          predicates:
            - Path=/php/**
          filters:
            - RewritePath=/php(?<segment>/?.*), $\{segment}

        - id: php-service
          uri: http://php:80
          predicates:
            - Path=/api/products/**
          filters:
            - RewritePath=/api/products(?<segment>/?.*), $\{segment}

        - id: django-service
          uri: http://django:8001
          predicates:
            - Path=/api/approvals/**, /api/notifications/**, /api/surveys/**, /api/django/**, /media/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

jwt:
  secret: ${JWT_SECRET}